services:
  angular-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 4200:4200
  angular-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
